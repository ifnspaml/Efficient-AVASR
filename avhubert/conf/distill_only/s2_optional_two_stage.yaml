# @package _global_

defaults:
  - base_continuous_75k

# Optional schedule diagnostic. This is the same materialized clean model as
# S1; the runner performs two ordinary-distillation Fairseq invocations.
optimization:
  max_update: 50000
  lr: [0.002]

lr_scheduler:
  warmup_updates: 15000
  total_num_update: 50000

model:
  student_arch: transformer
  student_depth: 6
  student_embed_dim: 384
  student_ffn_dim: 3200
  student_attention_heads: 12
  distill_head_mode: historical_pred_heads
  teacher_target_layers: "0,4,8,12"
  student_match_layers: ""
  initialization_policy: random_sequence_teacher_frontend
  schedule_mode: two_stage_50k_25k
  stage1_lr: 0.002
  stage2_lr: 0.0001
  max_update: 50000
  warmup_updates: 15000
  distillation_noise_prob: 0.0
  distillation_noise_snr: "0"
  distillation_noise_method: rms
  distillation_noise_manifest_root: null
  distillation_noise_train_only: true

task:
  noise_prob: 0.0
  noise_snr: "0"
  noise_method: rms
  noise_wav: null
  distillation_noise_prob: 0.0
  distillation_noise_snr: "0"
  distillation_noise_method: rms
  distillation_noise_manifest_root: null
  distillation_noise_train_only: true
