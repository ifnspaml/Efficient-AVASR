# @package _global_

# B2 and C1 are the same run: random sequence model with the explicitly
# retained, shape-compatible teacher-derived frontend.
model:
  student_arch: transformer
  student_depth: 2
  student_embed_dim: 768
  student_ffn_dim: 3072
  student_attention_heads: 12
  distill_head_mode: historical_pred_heads
  teacher_target_layers: "0,4,8,12"
  student_match_layers: ""
  initialization_policy: random_sequence_teacher_frontend
