# @package _global_

# Optional diagnostic, not part of the main matrix. This is the stage-1
# default. The generic launcher maps --stage stage2 to max_update=25000,
# lr=0.0001, warmup=5000, and finetune_from_model=<stage1 checkpoint_last.pt>.
optimization:
  max_update: 50000
  lr: [0.002]

lr_scheduler:
  warmup_updates: 15000
  total_num_update: 50000

model:
  schedule_mode: two_stage_50k_25k
  stage1_lr: 0.002
  stage2_lr: 0.0001
  max_update: 50000
  warmup_updates: 15000
