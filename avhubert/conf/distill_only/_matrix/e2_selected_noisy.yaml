# @package _global_

# E2 changes only train-time encoder-distillation noise after the E1 selection
# has been materialized. Validation/test splits remain clean.
task:
  noise_prob: 0.25
  noise_snr: "0"
  noise_num: 1
  noise_method: rms
  noise_wav: /beegfs/data/shared/lrs3/noise/musan/tsv/all
  distillation_noise_prob: 0.25
  distillation_noise_snr: "0"
  distillation_noise_method: rms
  distillation_noise_manifest_root: /beegfs/data/shared/lrs3/noise/musan/tsv/all
  distillation_noise_train_only: true

model:
  distillation_noise_prob: 0.25
  distillation_noise_snr: "0"
  distillation_noise_method: rms
  distillation_noise_manifest_root: /beegfs/data/shared/lrs3/noise/musan/tsv/all
  distillation_noise_train_only: true
